[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartgate"
version = "0.1.0"
description = "Dependency-free semantic cache & model routing gateway for LLM apps: prompt analysis, complexity-based model selection, cost controls and fallbacks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # none: the library uses only the Python standard library

[project.optional-dependencies]
# Development tooling only (running the test suite). Nothing here is needed to use smartgate.
dev = ["pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/rahpalrah/smartgate"

[project.scripts]
smartgate = "smartgate.cli:main"

[tool.setuptools.packages.find]
include = ["smartgate*"]
